<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title id="title">Overlapping warm circles on a soft gradient</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e9ff"/>
      <stop offset="1" stop-color="#fdf3e7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cbf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c7a9f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="440" cy="338" r="196" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="610" cy="338" r="196" fill="none" stroke="#c9a6ef" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="780" cy="338" r="196" fill="none" stroke="#e4c9a8" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="610" cy="338" r="78" fill="#7c5cbf" fill-opacity="0.12"/>
  <path d="M180 540 Q 420 470 610 540 T 1040 520" fill="none" stroke="#c9a6ef" stroke-opacity="0.5" stroke-width="2"/>
</svg>
